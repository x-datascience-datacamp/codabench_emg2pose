version: 2
title: "Datacamp 2026 - EMG2Pose: hand pose from wrist EMG"
description: >
  Predict the 20 joint angles of the hand over time from 16-channel wrist
  surface EMG. Submissions are a benchopt solver and its trained weights,
  evaluated on the platform, on a GPU. The public leaderboard column scores
  held-out movement stages; the final ranking uses a hidden private cohort
  of new users.
image: logo.png
registration_auto_approve: False

# The image submissions run in: built from tools/Dockerfile, it carries the
# requirements.txt stack. The benchmark ships in the phase input_data.
docker_image: ghcr.io/x-datascience-datacamp/emg2pose-compet:v1

# Only the leaderboard metrics are exposed.
enable_detailed_results: False
show_detailed_results_in_submission_panel: False
show_detailed_results_in_leaderboard: False

terms: pages/terms.md
pages:
  - title: Overview
    file: pages/overview.md
  - title: Participation
    file: pages/participate.md
  - title: Timeline
    file: pages/timeline.md

tasks:
  - index: 0
    name: EMG to pose
    description: >
      The ingestion program runs the benchopt benchmark on your submission
      (evaluation only); scoring parses the results.
    input_data: main_phase/input_data/
    reference_data: main_phase/reference_data/
    ingestion_program: ingestion_program/
    scoring_program: scoring_program/

solutions:
  - index: 0
    tasks:
      - 0
    path: solution/

# Dates are UTC+0, in the documented YYYY-MM-DD HH:MM:SS format.
phases:
  - index: 0
    name: Competition
    description: >
      Train your model locally, submit it with its weights. The public
      column scores the public test set; the final ranking uses the hidden
      private test set.
    start: 2026-10-29 00:00:00
    end: 2027-02-01 00:00:00
    execution_time_limit: 3600
    max_submissions_per_day: 5
    # results.parquet and scores.json carry the hidden private metrics.
    hide_prediction_output: True
    hide_score_output: True
    tasks:
      - 0

# Column keys must match the keys of phases/main/input_data/config.yaml
# (scoring.columns), plus `duration` added by the scoring program.
leaderboards:
  - title: Results
    key: main
    columns:
      - title: Angular MAE, deg (public)
        key: angular_mae
        index: 0
        sorting: asc
      - title: Per-subject MAE std, deg (public)
        key: angular_mae_subject_std
        index: 1
        sorting: asc
      - title: R2 (public)
        key: r2
        index: 2
        sorting: desc
      # Private columns: the sealed cohort, hidden for the whole challenge.
      - title: Angular MAE, deg (private)
        key: angular_mae_private
        index: 3
        sorting: asc
        hidden: True
      - title: Per-subject MAE std, deg (private)
        key: angular_mae_subject_std_private
        index: 4
        sorting: asc
        hidden: True
      - title: R2 (private)
        key: r2_private
        index: 5
        sorting: desc
        hidden: True
      - title: Duration (s)
        key: duration
        index: 6
        sorting: asc
